[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "black-scholes"
version = "0.2.0"
description = "Black-Scholes European option pricing with Greeks, implied volatility, and Monte Carlo validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deniz Ikili" }]
keywords = ["black-scholes", "options", "finance", "greeks", "quant", "monte-carlo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/buzludeniz/black_scholes_model"
Repository = "https://github.com/buzludeniz/black_scholes_model"

[project.gui-scripts]
bs-gui = "black_scholes.gui:run_gui"

[project.scripts]
bs = "black_scholes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
black_scholes = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
addopts = [
    "-q",
    "--doctest-modules",
    "--cov=black_scholes",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["black_scholes"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Greek letters are the correct symbols for the option Greeks in the GUI.
"src/black_scholes/gui.py" = ["RUF001"]
# assert is the point of a test; blind-except is narrowed where it matters.
"tests/*" = ["S101", "B017", "PT011"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true