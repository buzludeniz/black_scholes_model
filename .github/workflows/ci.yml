name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; individual jobs widen this if they need more.
permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # A passing test suite says nothing about whether the package can actually
      # be built and installed: a broken package discovery rule, a missing data
      # file, or a mistyped console entry point all pass `pytest` while leaving
      # `pip install` broken. This job builds the real artifacts and installs
      # the wheel into an environment that has never seen the source tree.
      # Both `dist/` and `.smoke/` are in .gitignore, so nothing built here is
      # committed.
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Install the wheel into a clean environment and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".smoke/Scripts/python.exe"
            BS=".smoke/Scripts/bs.exe"
          else
            PY=".smoke/bin/python"
            BS=".smoke/bin/bs"
          fi

          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl

          # Step outside the checkout before importing. This is what stops the
          # smoke test passing against the repository instead of the artifact:
          # with a src layout, `import black_scholes` can then only resolve to
          # the installed wheel.
          cd ..
          REPO="$OLDPWD"

          "$REPO/$PY" -c "import black_scholes; print('import ok:', black_scholes.__version__)"

          # Installed metadata must agree with the in-package __version__, so a
          # stale hardcoded string is caught here and by a unit test.
          "$REPO/$PY" -c "
          import importlib.metadata as md
          import black_scholes
          dist = md.version('black_scholes_model')
          assert dist == black_scholes.__version__, (dist, black_scholes.__version__)
          print('version ok:', dist)
          "

          # The console script must exist and run, not merely be importable.
          test -x "$REPO/$BS" || test -f "$REPO/$BS"
          "$REPO/$BS" --help > /dev/null
          echo "console script ok"

          # One real pricing call, checked against the known ATM value.
          "$REPO/$PY" -c "
          from black_scholes import OptionParams, black_scholes_price
          price = black_scholes_price(OptionParams(100.0, 100.0, 1.0, 0.05, 0.20))
          assert abs(price - 10.450584) < 1e-6, price
          print('pricing ok:', round(price, 6))
          "

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failure instead of stopping at the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # `gui.py` imports tkinter at module scope and pytest runs with
      # `--doctest-modules` over `src`, so collection imports that module.
      # setup-python's Linux builds already compile against Tcl/Tk, so no apt
      # package is required. Constructing a Tk root does need a display, though:
      # tests/test_gui.py skips itself when there is none, which drops total
      # coverage to roughly 70% and fails the 85% gate. xvfb is preinstalled on
      # the Ubuntu images, so the Linux leg runs against a virtual framebuffer
      # to keep the GUI tests and the coverage gate meaningful.
      # The coverage gate is passed on the command line rather than sitting in
      # pytest addopts. A gate in addopts also applies to partial runs, so
      # `pytest tests/test_gui.py` and even `pytest --collect-only` would report
      # failure for a suite that is entirely green. Coverage is still measured on
      # every local run; only the pass/fail decision is scoped to CI.
      - name: Run tests, doctests, and the coverage gate (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov-fail-under=85

      - name: Run tests, doctests, and the coverage gate (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --cov-fail-under=85

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ruff is a dev dependency, so `pip install -e ".[dev]"` already provides
      # it. `python -m ruff` is used because it does not depend on the console
      # script being on PATH.
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: mypy
        run: python -m mypy src/black_scholes